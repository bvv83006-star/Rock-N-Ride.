<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0e" />
<title>Rock'n Ride Cars</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ============ START SCREEN ============ -->
<div class="screen" id="startScreen">
  <div class="screen-card">
    <p class="eyebrow">10 CARS • OPEN CITY • MULTIPLAYER</p>
    <h1 class="logo">ROCK'N RIDE <em>CARS</em></h1>
    <p class="tagline">An open-world driving experience</p>

    <label class="field-label">YOUR NAME</label>
    <input class="field-input" id="nameInput" maxlength="20" placeholder="Enter name…" autocomplete="off" />

    <label class="field-label">CAR COLOUR</label>
    <div class="colors" id="startColors">
      <button data-color="#ff3b30" class="on" style="background:#ff3b30"></button>
      <button data-color="#ff8c00" style="background:#ff8c00"></button>
      <button data-color="#ffd400" style="background:#ffd400"></button>
      <button data-color="#38f7c0" style="background:#38f7c0"></button>
      <button data-color="#00d9ff" style="background:#00d9ff"></button>
      <button data-color="#2c7cff" style="background:#2c7cff"></button>
      <button data-color="#8833cc" style="background:#8833cc"></button>
      <button data-color="#ff1493" style="background:#ff1493"></button>
      <button data-color="#f7f7fb" style="background:#f7f7fb"></button>
      <button data-color="#8a8a99" style="background:#8a8a99"></button>
      <button data-color="#222222" style="background:#222222"></button>
      <button data-color="#39ff14" style="background:#39ff14"></button>
    </div>

    <button class="primary-btn" id="playBtn">START ENGINE ›</button>

    <div class="quick-links">
      <a href="/garage.html">🏠 Garage</a>
      <a href="/settings.html">⚙ Settings</a>
    </div>
  </div>
</div>

<!-- ============ MAIN GAME ============ -->
<div class="game hidden" id="gameShell">

  <div id="canvas"></div>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand"><span>ROCK'N</span> RIDE</div>
    <div class="top-actions">
      <div class="pill user-pill">
        <span class="avatar" id="userAvatar">P</span>
        <span id="userName">Player</span>
      </div>
      <div class="pill gold-pill"><i></i><span id="hudCoins">0</span></div>
      <div class="pill blue-pill"><i></i><span id="hudGears">0</span></div>
      <a class="icon-btn" href="/garage.html" title="Garage">🏠</a>
      <button class="icon-btn" id="musicBtn" title="Music">🎵</button>
      <a class="icon-btn" href="/settings.html" title="Settings">⚙</a>
      <button class="icon-btn" id="fsBtn" title="Fullscreen">⛶</button>
      <button class="icon-btn" id="pauseBtn" title="Pause">Ⅱ</button>
    </div>
  </header>

  <!-- RACE HUD (bottom-left) -->
  <section class="race-hud">
    <div class="speed-block">
      <strong id="speedEl">0</strong>
      <span>KM/H</span>
    </div>
    <div class="gear-block">
      <small>GEAR</small>
      <b id="gearEl">N</b>
    </div>
    <div class="nitro-wrap">
      <span>NITRO</span>
      <div class="nitro-bar"><i id="nitroEl" style="width:100%"></i></div>
    </div>
  </section>

  <!-- RACE INFO (top-left) -->
  <section class="race-info">
    <span>SCORE <b id="scoreEl">0</b></span>
    <span>CAR <b id="carNameEl">SEDAN</b></span>
    <span>AIR <b id="airEl">0.0s</b></span>
    <span>BEST <b id="bestAirEl">0.0s</b></span>
  </section>

  <!-- MINIMAP (top-right) -->
  <div class="minimap" id="minimap">
    <canvas id="minimapCanvas" width="140" height="140"></canvas>
    <div class="minimap-frame"></div>
  </div>

  <!-- CLOCK -->
  <div class="clock" id="clock">
    <small>TIME</small>
    <span id="clockEl">12:00</span>
  </div>

  <!-- DRIFT POPUP -->
  <div class="drift-pop" id="driftPop">
    DRIFT <b id="driftScore">0</b> ×<b id="driftMult">1.0</b>
  </div>

  <!-- BIG TEXT POPUP -->
  <div class="big-text" id="bigText"></div>

  <!-- SWAP HINT -->
  <div class="swap-hint" id="swapHint"></div>

  <!-- TOUCH: LEFT — steering -->
  <div class="touch-left" id="touchLeft">
    <button class="steer-btn" data-key="a" id="btnLeft">◀</button>
    <button class="steer-btn" data-key="d" id="btnRight">▶</button>
    <div class="wheel" id="steerWheel" style="display:none">
      <div class="wheel-ring"></div>
      <div class="wheel-grip" id="wheelGrip"></div>
    </div>
  </div>

  <!-- TOUCH: RIGHT — pedals -->
  <div class="touch-right" id="touchRight">
    <button class="pedal" data-key="shift" id="btnNitro">N₂O</button>
    <button class="pedal" data-key=" " id="btnDrift">DRIFT</button>
    <button class="pedal brake" data-key="s" id="btnBrake">BRAKE</button>
    <button class="pedal gas" data-key="w" id="btnGas">ACC</button>
  </div>

  <!-- CHAT -->
  <div class="chat-box" id="chatBox">
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-row">
      <input id="chatInput" maxlength="100" placeholder="Type message…" autocomplete="off" />
      <button id="chatSend">SEND</button>
    </div>
  </div>
  <button class="chat-toggle" id="chatToggle">💬</button>

  <!-- PAUSE OVERLAY -->
  <div class="pause-overlay hidden" id="pauseOverlay">
    <div class="pause-card">
      <h2>PAUSED</h2>
      <button class="primary-btn" id="resumeBtn">RESUME ›</button>
      <a class="secondary-btn" href="/garage.html">GARAGE</a>
      <a class="secondary-btn" href="/settings.html">SETTINGS</a>
      <button class="secondary-btn" id="quitBtn">QUIT TO MENU</button>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading hidden" id="loading">LOADING…</div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
  }
}
</script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/game.js"></script>
</body>
</html>
